apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validation-job
spec:
  completions: 8
  parallelism: 6
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: validator
        image: shard-validator:latest
        imagePullPolicy: Never
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "900m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
